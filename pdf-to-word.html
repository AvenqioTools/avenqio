
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Convert PDF files to editable Word documents online for free with Avenqio.">

<title>PDF to Word Converter - Avenqio</title>

<!-- PDF.js Library -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

<!-- DOCX Library -->
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f8fc;
    color:#172554;
}

header{
    background:white;
    padding:18px 7%;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
    font-size:26px;
    font-weight:bold;
    color:#5b4cf0;
    text-decoration:none;
}

.container{
    max-width:700px;
    margin:55px auto;
    padding:20px;
}

.tool-box{
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.06);
    text-align:center;
}

h1{
    font-size:32px;
    margin-top:0;
}

p{
    color:#64748b;
    line-height:1.6;
}

.upload{
    display:block;
    border:2px dashed #a5a0f5;
    border-radius:12px;
    padding:30px 15px;
    margin:25px 0;
    cursor:pointer;
    background:#fafaff;
}

.upload input{
    display:none;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:8px;
    background:#5b4cf0;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    background:#4335d5;
}

button:disabled{
    background:#aaa;
    cursor:not-allowed;
}

#status{
    margin-top:20px;
    font-weight:bold;
    overflow-wrap:anywhere;
}

.download{
    display:none;
    background:#16a34a;
    text-decoration:none;
    color:white;
    padding:13px 25px;
    border-radius:8px;
    margin-top:15px;
}

footer{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.home{
    color:#5b4cf0;
    text-decoration:none;
}

@media(max-width:600px){
    .container{
        margin:25px auto;
    }

    .tool-box{
        padding:22px;
    }

    h1{
        font-size:26px;
    }
}
</style>
</head>

<body>

<header>
    <a class="logo" href="index.html">Avenqio</a>
</header>

<div class="container">

<div class="tool-box">

<h1>PDF to Word Converter</h1>

<p>
Convert your PDF document into an editable Word file.
Upload your PDF and download the converted DOCX document.
</p>

<label class="upload">

<strong>📄 Choose PDF File</strong>

<p id="fileName">Click here to upload your PDF</p>

<input type="file" id="pdfFile" accept=".pdf,application/pdf">

</label>

<button id="convertBtn" onclick="convertPDF()">
Convert to Word
</button>

<div id="status"></div>

<a id="downloadBtn" class="download" download="avenqio-converted.docx">
Download Word File
</a>

</div>
</div>

<footer>

<a class="home" href="index.html">← Back to Home</a>

<p>© 2026 Avenqio. All rights reserved.</p>

</footer>

<script>

// Configure PDF.js worker
if(window.pdfjsLib){

    pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

}

// Elements
const pdfInput = document.getElementById("pdfFile");
const fileName = document.getElementById("fileName");
const statusBox = document.getElementById("status");
const downloadBtn = document.getElementById("downloadBtn");
const convertBtn = document.getElementById("convertBtn");

// File selection
pdfInput.addEventListener("change",function(){

    if(this.files.length){

        fileName.textContent = this.files[0].name;

        statusBox.textContent = "";

        downloadBtn.style.display = "none";

    }

});

// PDF to Word Conversion
async function convertPDF(){

    const file = pdfInput.files[0];

    downloadBtn.style.display = "none";

    if(!file){

        statusBox.textContent = "Please select a PDF file first.";

        return;

    }

    if(!window.pdfjsLib || !window.docx){

        statusBox.textContent =
        "Libraries could not load. Please check your internet connection and refresh the page.";

        return;

    }

    try{

        convertBtn.disabled = true;

        convertBtn.textContent = "Converting...";

        statusBox.textContent = "Reading PDF document...";

        // Read PDF file
        const bytes = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({

            data:new Uint8Array(bytes)

        }).promise;

        const paragraphs = [];

        // Extract text from every page
        for(let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++){

            statusBox.textContent =
            "Processing page " + pageNumber + " of " + pdf.numPages + "...";

            const page = await pdf.getPage(pageNumber);

            const content = await page.getTextContent();

            const pageText = content.items

                .filter(item => item.str !== undefined)

                .map(item => item.str)

                .join(" ")

                .trim();

            paragraphs.push(

                new docx.Paragraph({

                    text:"Page " + pageNumber,

                    heading:docx.HeadingLevel.HEADING_2,

                    spacing:{after:200}

                })

            );

            if(pageText){

                paragraphs.push(

                    new docx.Paragraph({

                        text:pageText,

                        spacing:{after:300}

                    })

                );

            }else{

                paragraphs.push(

                    new docx.Paragraph({

                        text:"No readable text found on this page.",

                        spacing:{after:300}

                    })

                );

            }

        }

        // Create Word document
        statusBox.textContent = "Creating Word document...";

        const wordDocument = new docx.Document({

            sections:[{

                properties:{},

                children:paragraphs

            }]

        });

        // Generate DOCX file
        const blob = await docx.Packer.toBlob(wordDocument);

        const url = URL.createObjectURL(blob);

        downloadBtn.href = url;

        downloadBtn.download = "avenqio-converted.docx";

        downloadBtn.style.display = "inline-block";

        statusBox.textContent =
        "Success! Your " + pdf.numPages +
        " page(s) PDF has been converted to Word.";

    }

    catch(error){

        console.error(error);

        statusBox.textContent =
        error.message || "Conversion failed. Please try another PDF file.";

    }

    finally{

        convertBtn.disabled = false;

        convertBtn.textContent = "Convert to Word";

    }

}

</script>

</body>
</html>
