
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Convert images to Base64 online for free with Avenqio.">

<title>Image to Base64 Converter - Avenqio</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f8fc;
    color: #172554;
}

header {
    background: white;
    padding: 20px 8%;
    box-shadow: 0 2px 10px #00000010;
}

.logo {
    color: #5b4cf0;
    font-size: 26px;
    font-weight: bold;
    text-decoration: none;
}

.container {
    max-width: 850px;
    margin: 50px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 5px 25px #0000000c;
}

h1 {
    font-size: 30px;
}

p {
    color: #64748b;
    line-height: 1.7;
}

.upload {
    display: block;
    padding: 30px;
    margin: 25px 0;
    border: 2px dashed #5b4cf0;
    border-radius: 12px;
    background: #fafaff;
}

input {
    margin-top: 15px;
    max-width: 100%;
}

.preview img {
    max-width: 100%;
    max-height: 250px;
    margin: 20px auto;
    border-radius: 8px;
}

textarea {
    width: 100%;
    min-height: 180px;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-top: 15px;
    font-size: 13px;
    resize: vertical;
    word-break: break-all;
}

button {
    background: #5b4cf0;
    color: white;
    border: none;
    padding: 13px 22px;
    margin: 8px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #4535d5;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

#status {
    margin-top: 15px;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

a {
    color: #5b4cf0;
}
</style>
</head>

<body>

<header>
<a href="index.html" class="logo">Avenqio</a>
</header>

<div class="container">

<div class="card">

<h1>Image to Base64 Converter</h1>

<p>Convert your images into Base64 encoded text online for free.</p>

<label class="upload">
<strong>Select Your Image</strong>
<br>
<input type="file" id="imageInput" accept="image/*">
</label>

<div class="preview">
<img id="preview" style="display:none;" alt="Image Preview">
</div>

<button id="convertBtn" disabled>Convert to Base64</button>

<p id="status">Choose an image to get started.</p>

<textarea id="output" placeholder="Your Base64 code will appear here..." readonly></textarea>

<div>
<button id="copyBtn" disabled>Copy Base64</button>
<button id="downloadBtn" disabled>Download TXT</button>
</div>

</div>
</div>

<footer>
<p>© 2026 Avenqio. Simple and useful online tools.</p>
<a href="index.html">Back to Home</a>
</footer>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const convertBtn = document.getElementById("convertBtn");
const copyBtn = document.getElementById("copyBtn");
const downloadBtn = document.getElementById("downloadBtn");
const output = document.getElementById("output");
const status = document.getElementById("status");

let selectedFile = null;
let base64Data = "";
let previewURL = null;

imageInput.addEventListener("change", function() {

    const file = imageInput.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        status.textContent = "Please select a valid image.";
        return;
    }

    if (file.size > 5 * 1024 * 1024) {
        status.textContent = "Please select an image smaller than 5 MB.";
        return;
    }

    selectedFile = file;
    base64Data = "";

    output.value = "";
    copyBtn.disabled = true;
    downloadBtn.disabled = true;

    if (previewURL) {
        URL.revokeObjectURL(previewURL);
    }

    previewURL = URL.createObjectURL(file);

    preview.src = previewURL;
    preview.style.display = "block";

    convertBtn.disabled = false;

    status.textContent = "Image selected successfully.";

});

convertBtn.addEventListener("click", function() {

    if (!selectedFile) return;

    status.textContent = "Converting image...";

    const reader = new FileReader();

    reader.onload = function() {

        base64Data = reader.result;

        output.value = base64Data;

        status.textContent = "Image converted successfully!";

        copyBtn.disabled = false;
        downloadBtn.disabled = false;

    };

    reader.onerror = function() {

        status.textContent = "Conversion failed. Please try again.";

    };

    reader.readAsDataURL(selectedFile);

});

copyBtn.addEventListener("click", async function() {

    if (!base64Data) return;

    try {

        await navigator.clipboard.writeText(base64Data);

        status.textContent = "Base64 code copied successfully!";

    } catch (error) {

        output.select();
        document.execCommand("copy");

        status.textContent = "Base64 code copied.";

    }

});

downloadBtn.addEventListener("click", function() {

    if (!base64Data) return;

    const blob = new Blob(
        [base64Data],
        {type: "text/plain"}
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "avenqio-base64.txt";

    link.click();

    URL.revokeObjectURL(url);

    status.textContent = "TXT file downloaded successfully.";

});

</script>

</body>
</html>
