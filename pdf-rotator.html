
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Rotate PDF pages online for free with Avenqio. Rotate all pages by 90, 180 or 270 degrees and download your PDF.">
<title>PDF Rotator - Avenqio</title>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f8fc;color:#172554}
header{background:white;padding:18px 7%;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.logo{font-size:26px;font-weight:bold;color:#5b4cf0;text-decoration:none}
.container{max-width:700px;margin:55px auto;padding:20px}
.tool-box{background:white;padding:35px;border-radius:15px;box-shadow:0 5px 25px rgba(0,0,0,.06);text-align:center}
h1{font-size:32px;margin-top:0}
p{color:#64748b;line-height:1.6}
.upload{display:block;border:2px dashed #a5a0f5;border-radius:12px;padding:30px 15px;margin:25px 0;cursor:pointer;background:#fafaff}
.upload input{display:none}
select{width:100%;padding:14px;border:1px solid #d6d9e5;border-radius:8px;font-size:16px;background:white}
label{display:block;text-align:left;font-weight:bold;margin:18px 0 8px}
button{width:100%;padding:15px;border:0;border-radius:8px;background:#5b4cf0;color:white;font-size:16px;font-weight:bold;cursor:pointer;margin-top:20px}
button:hover{background:#4335d5}
button:disabled{background:#aaa;cursor:not-allowed}
#status{margin-top:20px;font-weight:bold;overflow-wrap:anywhere}
.download{display:none;background:#16a34a;text-decoration:none;color:white;padding:13px 25px;border-radius:8px;margin-top:15px}
footer{text-align:center;padding:25px;color:#64748b}
.home{color:#5b4cf0;text-decoration:none}
@media(max-width:600px){.container{margin:25px auto}.tool-box{padding:22px}h1{font-size:26px}}
</style>
</head>

<body>

<header>
<a class="logo" href="index.html">Avenqio</a>
</header>

<div class="container">
<div class="tool-box">

<h1>PDF Rotator</h1>
<p>Rotate your PDF pages easily and download the updated PDF file.</p>

<label class="upload">
<strong>📄 Choose PDF File</strong>
<p id="fileName">Click here to upload your PDF</p>
<input type="file" id="pdfFile" accept=".pdf,application/pdf">
</label>

<label for="rotation">Select Rotation Angle</label>
<select id="rotation">
<option value="90">Rotate 90° Clockwise</option>
<option value="180">Rotate 180°</option>
<option value="270">Rotate 270° Clockwise</option>
</select>

<button id="rotateBtn" onclick="rotatePDF()">Rotate PDF</button>

<div id="status"></div>

<a id="downloadBtn" class="download" download="avenqio-rotated.pdf">
Download Rotated PDF
</a>

</div>
</div>

<footer>
<a class="home" href="index.html">← Back to Home</a>
<p>© 2026 Avenqio. All rights reserved.</p>
</footer>

<script>
const pdfInput = document.getElementById("pdfFile");
const fileName = document.getElementById("fileName");
const statusBox = document.getElementById("status");
const downloadBtn = document.getElementById("downloadBtn");
const rotateBtn = document.getElementById("rotateBtn");

pdfInput.addEventListener("change", function(){
    if(this.files.length){
        fileName.textContent = this.files[0].name;
        statusBox.textContent = "";
        downloadBtn.style.display = "none";
    }
});

async function rotatePDF(){
    const file = pdfInput.files[0];
    const angle = Number(document.getElementById("rotation").value);

    downloadBtn.style.display = "none";

    if(!file){
        statusBox.textContent = "Please select a PDF file first.";
        return;
    }

    if(!window.PDFLib){
        statusBox.textContent = "PDF library could not load. Please check your internet connection and refresh the page.";
        return;
    }

    try{
        rotateBtn.disabled = true;
        rotateBtn.textContent = "Processing...";
        statusBox.textContent = "Please wait, rotating your PDF...";

        const { PDFDocument, degrees } = PDFLib;
        const bytes = await file.arrayBuffer();
        const pdfDoc = await PDFDocument.load(bytes);

        const pages = pdfDoc.getPages();

        pages.forEach(page => {
            const currentAngle = page.getRotation().angle;
            page.setRotation(degrees((currentAngle + angle) % 360));
        });

        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], {type:"application/pdf"});
        const url = URL.createObjectURL(blob);

        downloadBtn.href = url;
        downloadBtn.download = "avenqio-rotated.pdf";
        downloadBtn.style.display = "inline-block";

        statusBox.textContent = "Success! All " + pages.length + " page(s) rotated.";

    }catch(error){
        statusBox.textContent = error.message || "Something went wrong. Please try another PDF.";
    }finally{
        rotateBtn.disabled = false;
        rotateBtn.textContent = "Rotate PDF";
    }
}
</script>

</body>
</html>
