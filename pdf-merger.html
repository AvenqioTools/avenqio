<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Merge multiple PDF files into one PDF document easily with Avenqio's free online PDF merger.">
<title>PDF Merger - Avenqio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f8fc;
color:#172554;
}
header{
background:white;
padding:20px 8%;
box-shadow:0 2px 10px #0000000d;
}
header a{
text-decoration:none;
font-size:25px;
font-weight:bold;
color:#5b4cf0;
}
main{
max-width:750px;
margin:55px auto;
padding:35px 25px;
background:white;
border-radius:15px;
box-shadow:0 5px 25px #0000000d;
text-align:center;
}
h1{font-size:30px}
p{color:#64748b;line-height:1.7}
.upload{
display:block;
margin:25px auto;
padding:35px 15px;
border:2px dashed #5b4cf0;
border-radius:12px;
background:#fafaff;
cursor:pointer;
}
input{margin-top:15px;max-width:100%}
button{
background:#5b4cf0;
color:white;
border:0;
padding:14px 25px;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin:10px;
}
button:disabled{opacity:.5;cursor:not-allowed}
#status{margin-top:20px;font-weight:bold}
footer{
text-align:center;
padding:25px;
color:#64748b;
}
</style>
</head>

<body>

<header>
<a href="index.html">Avenqio</a>
</header>

<main>
<h1>PDF Merger</h1>
<p>Combine multiple PDF files into one PDF document quickly and easily.</p>

<label class="upload">
<strong>Select PDF Files</strong>
<br>
<input type="file" id="pdfFiles" accept=".pdf,application/pdf" multiple>
</label>

<p id="fileCount">No files selected</p>

<button id="mergeBtn" disabled>Merge PDF Files</button>

<p id="status"></p>
</main>

<footer>
Simple and useful online tools for your everyday digital needs.
</footer>

<script>
const input = document.getElementById("pdfFiles");
const button = document.getElementById("mergeBtn");
const status = document.getElementById("status");
const count = document.getElementById("fileCount");

input.addEventListener("change", () => {
const files = Array.from(input.files);
count.textContent = files.length + " PDF file(s) selected";
button.disabled = files.length < 2;
status.textContent = "";
});

button.addEventListener("click", async () => {
const files = Array.from(input.files);

if(files.length < 2) {
status.textContent = "Please select at least two PDF files.";
return;
}

button.disabled = true;
status.textContent = "Merging PDFs... Please wait.";

try {
const mergedPdf = await PDFLib.PDFDocument.create();

for(const file of files) {
const bytes = await file.arrayBuffer();
const pdf = await PDFLib.PDFDocument.load(bytes);
const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());

pages.forEach(page => mergedPdf.addPage(page));
}

const mergedBytes = await mergedPdf.save();
const blob = new Blob([mergedBytes], {type:"application/pdf"});
const url = URL.createObjectURL(blob);

const link = document.createElement("a");
link.href = url;
link.download = "Avenqio-Merged.pdf";
link.click();

URL.revokeObjectURL(url);
status.textContent = "Success! Your merged PDF has been downloaded.";

} catch(error) {
status.textContent = "Unable to merge these PDFs. Please check your files.";
console.error(error);
}

button.disabled = false;
});
</script>

</body>
</html>
