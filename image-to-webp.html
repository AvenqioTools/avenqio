
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Convert images to WebP format online for free with Avenqio.">

<title>Image to WebP Converter - Avenqio</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f8fc;
    color: #172554;
}

header {
    background: white;
    padding: 20px 8%;
    box-shadow: 0 2px 10px #00000010;
}

.logo {
    color: #5b4cf0;
    font-size: 26px;
    font-weight: bold;
    text-decoration: none;
}

.container {
    max-width: 850px;
    margin: 50px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 5px 25px #0000000c;
}

h1 {
    font-size: 30px;
}

p {
    color: #64748b;
    line-height: 1.7;
}

.upload {
    display: block;
    padding: 30px;
    margin: 25px 0;
    border: 2px dashed #5b4cf0;
    border-radius: 12px;
    background: #fafaff;
}

input {
    margin-top: 15px;
    max-width: 100%;
}

.preview img {
    max-width: 100%;
    max-height: 300px;
    margin: 20px auto;
    border-radius: 8px;
}

.quality {
    margin: 25px 0;
    padding: 15px;
    background: #f7f8fc;
    border-radius: 10px;
}

.quality input {
    width: 80%;
}

button {
    background: #5b4cf0;
    color: white;
    border: none;
    padding: 13px 22px;
    margin: 8px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #4535d5;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

#status {
    margin-top: 15px;
    font-weight: bold;
}

.info {
    background: #f7f8fc;
    padding: 15px;
    margin-top: 15px;
    border-radius: 10px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

footer a {
    color: #5b4cf0;
}
</style>
</head>

<body>

<header>
<a href="index.html" class="logo">Avenqio</a>
</header>

<div class="container">

<div class="card">

<h1>Image to WebP Converter</h1>

<p>Convert your images into WebP format online for free. Choose your quality and download your converted image.</p>

<label class="upload">
<strong>Select Your Image</strong>
<br>
<input type="file" id="imageInput" accept="image/*">
</label>

<div class="preview">
<img id="preview" style="display:none;" alt="Image Preview">
</div>

<div class="quality">

<label for="quality">
<strong>Image Quality: <span id="qualityValue">85%</span></strong>
</label>

<br>

<input type="range" id="quality" min="10" max="100" value="85">

</div>

<button id="convertBtn" disabled>Convert to WebP</button>

<div class="info" id="info" style="display:none;">
<p id="originalSize"></p>
<p id="convertedSize"></p>
</div>

<p id="status">Choose an image to get started.</p>

<div id="downloadArea"></div>

</div>
</div>

<footer>
<p>© 2026 Avenqio. Simple and useful online tools.</p>
<a href="index.html">Back to Home</a>
</footer>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const quality = document.getElementById("quality");
const qualityValue = document.getElementById("qualityValue");
const convertBtn = document.getElementById("convertBtn");
const status = document.getElementById("status");
const downloadArea = document.getElementById("downloadArea");
const info = document.getElementById("info");

let selectedImage = null;
let imageURL = null;
let downloadURL = null;

quality.addEventListener("input", function() {
    qualityValue.textContent = quality.value + "%";
});

imageInput.addEventListener("change", function() {

    const file = imageInput.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        status.textContent = "Please select a valid image.";
        return;
    }

    if (file.size > 15 * 1024 * 1024) {
        status.textContent = "Please select an image smaller than 15 MB.";
        return;
    }

    selectedImage = file;

    if (imageURL) {
        URL.revokeObjectURL(imageURL);
    }

    if (downloadURL) {
        URL.revokeObjectURL(downloadURL);
        downloadURL = null;
    }

    imageURL = URL.createObjectURL(file);

    preview.src = imageURL;
    preview.style.display = "block";

    convertBtn.disabled = false;
    downloadArea.innerHTML = "";
    info.style.display = "none";

    status.textContent = "Image selected successfully.";

});

convertBtn.addEventListener("click", function() {

    if (!selectedImage) return;

    convertBtn.disabled = true;
    status.textContent = "Converting image...";
    downloadArea.innerHTML = "";

    const img = new Image();

    img.onload = function() {

        const canvas = document.createElement("canvas");

        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(img, 0, 0);

        const qualityLevel = Number(quality.value) / 100;

        canvas.toBlob(function(blob) {

            if (!blob || blob.type !== "image/webp") {

                status.textContent = "WebP conversion is not supported by this browser.";

                convertBtn.disabled = false;
                return;

            }

            if (downloadURL) {
                URL.revokeObjectURL(downloadURL);
            }

            downloadURL = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = downloadURL;
            link.download = selectedImage.name.replace(/\.[^/.]+$/, "") + ".webp";

            const button = document.createElement("button");

            button.textContent = "Download WebP Image";

            link.appendChild(button);

            downloadArea.appendChild(link);

            document.getElementById("originalSize").textContent =
                "Original Size: " + (selectedImage.size / 1024).toFixed(2) + " KB";

            document.getElementById("convertedSize").textContent =
                "WebP Size: " + (blob.size / 1024).toFixed(2) + " KB";

            info.style.display = "block";

            status.textContent = "Image converted successfully!";

            convertBtn.disabled = false;

            canvas.width = 0;
            canvas.height = 0;

        }, "image/webp", qualityLevel);

    };

    img.onerror = function() {

        status.textContent = "Unable to process this image.";
        convertBtn.disabled = false;

    };

    img.src = imageURL;

});

</script>

</body>
</html>
